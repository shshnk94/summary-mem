[project]
name = "summary-mem"
version = "0.1.0"
description = "Hierarchical-summary + entity-graph memory mechanism for the memLLM benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "numpy",
    "networkx",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summary_mem"]
