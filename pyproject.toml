[project]
name = "summary-mem"
version = "0.1.0"
description = "Hierarchical-summary + entity-graph memory mechanism for the memLLM benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub==0.34.5",
    "image>=1.5.33",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "langid>=1.1.4",
    "matplotlib>=3.8",
    "mysqlclient>=2.2.8",
    "nltk>=3.9.4",
    "numpy>=2.0",
    "openai>=1.50",
    "pandas>=2.2.2,<3.0",
    "patsy>=0.5.1,<=0.5.6",
    "plotnine>=0.15.3",
    "pyreadr>=0.5.6",
    "python-dateutil>=2.5.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.8.0",
    "scipy>=0.13.3",
    "setuptools>=81.0.0",
    "simplejson>=4.1.1",
    "sqlalchemy>=2.0.49",
    "statsmodels>=0.5.0",
    "tenacity>=9.0",
    "torch==2.7.1",
    "tqdm>=4.66",
    "transformers==4.57.6",
    "wordcloud>=1.1.3",
]

[project.scripts]
summary-mem-eval = "summary_mem.eval:main"

# CUDA 12's cuSPARSE hard-links libnvJitLink.so.12, and /etc/bash.bashrc puts the
# system CUDA 12.0 lib64 on LD_LIBRARY_PATH, where its older copy shadows the wheel's
# and breaks `import torch`. nvJitLink did not exist before CUDA 12, so the cu118
# build sidesteps the clash entirely. cu118 wheels are not published to PyPI.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summary_mem"]
